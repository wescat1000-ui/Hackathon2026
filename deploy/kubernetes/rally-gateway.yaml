# Local Docker Desktop Kubernetes gateway to the working API on this Mac.
# No Elasticsearch credentials or note content belong in this manifest.
apiVersion: v1
kind: Namespace
metadata:
  name: rally
  labels:
    app.kubernetes.io/part-of: rally
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rally-gateway
  namespace: rally
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      client_max_body_size 1m;
      location /api/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rally-gateway
  namespace: rally
  labels:
    app.kubernetes.io/name: rally-gateway
    app.kubernetes.io/part-of: rally
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rally-gateway
  template:
    metadata:
      labels:
        app: rally-gateway
        app.kubernetes.io/name: rally-gateway
        app.kubernetes.io/part-of: rally
    spec:
      containers:
        - name: gateway
          image: nginx:1.28-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: rally-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: rally-gateway
  namespace: rally
  labels:
    app.kubernetes.io/name: rally-gateway
    app.kubernetes.io/part-of: rally
spec:
  selector:
    app: rally-gateway
  ports:
    - port: 8000
      targetPort: 8080
